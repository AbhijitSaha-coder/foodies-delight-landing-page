<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie’s Delight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Main Heading -->
    <h1>Foodie’s Delight</h1>

    <!-- Restaurant Description -->
    <p class="description">
        Welcome to Foodie’s Delight! We serve delicious dishes made with fresh ingredients.
        Come and enjoy a culinary experience that tantalizes your taste buds.
    </p>

    <!-- Food Images Side by Side -->
    <div class="gallery">
        <div class="food-item">
            <img src="https://imgs.search.brave.com/AErI91ZKadE51jncJQH5uOrnXDtx2q3FyPKeDggWM9Y/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zdGF0/aWMudmVjdGVlenku/Y29tL3N5c3RlbS9y/ZXNvdXJjZXMvdGh1/bWJuYWlscy8wMjMv/MzA0Lzg0My9zbWFs/bC9kZWxpY2lvdXMt/cGFzdGEtb24tdGhl/LXRhYmxlLWFpLWdl/bmVyYXRlLXBob3Rv/LmpwZw" alt="Dish 1">
            <p class="caption">Delicious Pasta</p>
        </div>
        <div class="food-item">
            <img src="https://imgs.search.brave.com/Ks3_i37EDXBcKWO-B2KlNllOuGXBsRCRjnwdnQCNr3o/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly90aHVt/YnMuZHJlYW1zdGlt/ZS5jb20vYi90YXN0/eS1idXJnZXItc2Fu/ZHdpY2gtaGFuZHMt/d2VhcmVkLWJsYWNr/LWdsb3Zlcy1iYWNr/Z3JvdW5kLXdoaXRl/LTk1MDU3NDI3Lmpw/Zw" alt="Dish 2">
            <p class="caption">Tasty Burger</p>
        </div>
    </div>

    <!-- Link to Full Menu -->
    <a href="menu.html" class="menu-link" target="_blank">View Full Menu</a>

    <!-- Contact Form -->
    <form class="contact-form">
        <h2>Contact Us</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Write your message..." required></textarea>

        <input type="submit" value="Send Message">
    </form>

</body>
</html>
